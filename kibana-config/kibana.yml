# =====================================================================
# KIBANA FULL CONFIGURATION (kibana.yml) - FINAL FIXED
# =====================================================================

server.port: 5601
server.host: "0.0.0.0"

# [หน้าบ้าน] เปิดใช้งาน HTTPS สำหรับเว็บบราวเซอร์คุยกับ Kibana UI
server.ssl.enabled: true
server.ssl.certificate: "/usr/share/kibana/config/certs/kibana.crt"
server.ssl.key: "/usr/share/kibana/config/certs/kibana.key"

# [หลังบ้าน] การเชื่อมต่อระหว่าง Kibana -> Elasticsearch 
elasticsearch.hosts: ["https://elasticsearch:9200"]

# บัญชีระบบหลังบ้าน
elasticsearch.username: "kibana_system"
elasticsearch.password: "P@ssw0rd" 

# ตรวจสอบเซิร์ตฝั่ง Elasticsearch
elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca.crt"]

elasticsearch.ssl.certificate: "/usr/share/kibana/config/certs/kibana.crt"
elasticsearch.ssl.key: "/usr/share/kibana/config/certs/kibana.key"
elasticsearch.ssl.alwaysPresentCertificate: true

# เลี่ยงปัญหา IP คอนเทนเนอร์ไม่ตรงกับชื่อจดทะเบียนใน SAN
elasticsearch.ssl.verificationMode: "certificate"