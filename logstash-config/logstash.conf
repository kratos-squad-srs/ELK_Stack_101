# =====================================================================
# LOGSTASH PRODUCTION-GRADE CONFIGURATION (logstash.conf)
# =====================================================================

input {
  # เปิดประตูรอรับข้อมูลที่ Filebeat จะส่งเข้ามาพอร์ต 5044
  beats {
    port => 5044

    # เปิดใช้งานระบบรักษาความปลอดภัยระดับสูงสุด (mTLS)
    ssl => true
    
    # ใบรับรองและกุญแจส่วนตัวของตู้ Logstash เอง
    ssl_certificate => "/usr/share/logstash/config/certs/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash.key"
    
    # [mTLS ไฮไลต์]: บังคับให้ Filebeat ต้องส่งใบ Cert มาแสดงตัวตนด้วย (ห้ามเนียนส่ง)
    ssl_verify_mode => "force_peer"
    
    # ระบุใบ CA ตัวแม่เพื่อใช้ตรวจสอบลายนิ้วมือใบ Cert ที่ Filebeat ส่งมา
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]
  }
}

filter {
  # โรงงานแปรรูป: ใช้มีดโกน Grok หั่นข้อความดิบยาวๆ ให้เป็นฟิลด์ JSON อัจฉริยะ
  grok {
    # สแกนหาเวลามาตรฐานสากล (ISO8601) -> ตามด้วยระดับ Log -> ตามด้วยเนื้อความ
    match => { "message" => "%{TIMESTAMP_ISO8601:log_time} %{LOGLEVEL:log_level} %{GREEDYDATA:log_message}" }
  }
}

output {
  # ขาส่งพัสดุเข้าคลังสินค้าหลักของ Elasticsearch ทะลุช่องทาง HTTPS Secure
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    
    # ชื่อ Alias ปลายทางที่เราตั้งตู้จองสนามสอบดักไว้ใน Elasticsearch
    index => "logstash-logs"

    # ปิดไม่ให้ Logstash พยายามไปสร้าง Template ซ้ำซ้อน (เพราะเราคุมสิทธิ์ Explicit Mapping เองแล้ว)
    manage_template => false
    
    # ความปลอดภัยระดับสูง: เรียกใช้ไอดีเฉพาะกิจและรหัสผ่านที่ส่งต่อมาจากไฟล์ .env ทะลุ Docker
    user => "${LOGSTASH_WRITER_USER}"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    
    # ยื่นใบรับรองผ่านประตูด่านตรวจ HTTPS ของ Elasticsearch
    ssl_enabled => true
    ssl_verification_mode => "full"
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]
  }
  
  # แถมสปอตไลต์พ่นออกหน้าจอ Terminal ของตู้ด่วนๆ เอาไว้ส่องดูเวลา Log ไหลผ่านจริง
  stdout { 
    codec => rubydebug 
  }
}